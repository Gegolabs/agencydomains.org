# Publicador por tag — construye los libros y despliega el sitio a GitHub Pages.
#
#   git tag agencydomains-v0.5 && git push --tags   → publica TODO automáticamente
#   git tag aura-v0.3 && git push --tags            → ídem (el sitio es un solo artefacto)
#
# También se puede disparar a mano (workflow_dispatch) para republicar el estado
# actual de main sin crear tag (p. ej. tras editar el shell en site/).
#
# El deploy es por artefacto (Pages en modo "GitHub Actions"): lo publicado nunca
# se committea — el repo contiene solo fuente (src/) y shell estático (site/).
name: publish

on:
  push:
    tags: ['agencydomains-v*', 'aura-v*', 'rte-v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar versiones (CHANGELOG de cada libro) y validar tag
        run: |
          AGD_VERSION=$(grep -m1 -oE "^## v[0-9]+\.[0-9]+(\.[0-9]+)?" src/agencydomains/CHANGELOG.md | cut -d" " -f2)
          AURA_VERSION=$(grep -m1 -oE "^## v[0-9]+\.[0-9]+(\.[0-9]+)?" src/aura/CHANGELOG.md | cut -d" " -f2)
          RTE_VERSION=$(grep -m1 -oE "^## v[0-9]+\.[0-9]+(\.[0-9]+)?" src/rte/CHANGELOG.md | cut -d" " -f2)
          echo "AGD_VERSION=$AGD_VERSION" >> "$GITHUB_ENV"
          echo "AURA_VERSION=$AURA_VERSION" >> "$GITHUB_ENV"
          echo "RTE_VERSION=$RTE_VERSION" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              agencydomains-*) TAG_V="${GITHUB_REF_NAME#agencydomains-}"; BOOK_V="$AGD_VERSION";;
              aura-*)          TAG_V="${GITHUB_REF_NAME#aura-}";          BOOK_V="$AURA_VERSION";;
              rte-*)           TAG_V="${GITHUB_REF_NAME#rte-}";           BOOK_V="$RTE_VERSION";;
              *) echo "::error::Tag desconocido: $GITHUB_REF_NAME"; exit 1;;
            esac
            if [ "$TAG_V" != "$BOOK_V" ]; then
              echo "::error::El tag dice $TAG_V pero el CHANGELOG del libro dice $BOOK_V. Actualiza el CHANGELOG (## $TAG_V) o corrige el tag."
              exit 1
            fi
          fi

      - name: Guardia — el shell enlaza las versiones que se publican
        run: |
          # El Libro I nombra sus distribuibles por idioma (RealTimeEnterprise / EmpresaTiempoReal)
          for f in site/llms.txt site/index.html; do
            for pref in "AgencyDomains-${AGD_VERSION}-" "AURA-${AURA_VERSION}-" "RealTimeEnterprise-${RTE_VERSION}-"; do
              if ! grep -q "$pref" "$f"; then
                echo "::error::$f no enlaza ningún archivo ${pref}*. Actualiza los links del shell a la versión nueva."
                exit 1
              fi
            done
          done
          for f in site/es/llms.txt site/es/index.html; do
            for pref in "AgencyDomains-${AGD_VERSION}-" "AURA-${AURA_VERSION}-" "EmpresaTiempoReal-${RTE_VERSION}-"; do
              if ! grep -q "$pref" "$f"; then
                echo "::error::$f no enlaza ningún archivo ${pref}*. Actualiza los links del shell a la versión nueva."
                exit 1
              fi
            done
          done

      - name: Guardia — los derivados no derivan (builds, manifiestos, shell)
        run: |
          FAIL=0
          # 1) frontmatter.tex de AGD lleva la versión vigente (entra al PDF ES publicado)
          if ! grep -q "${AGD_VERSION}" src/agencydomains/_build/frontmatter.tex; then
            echo "::error::frontmatter.tex de AGD no menciona v${AGD_VERSION} — el PDF llevaría impresa otra versión."; FAIL=1
          fi
          # 2) el mes/año de las portadas de build coincide con el frontmatter de cada libro
          for libro in rte aura agencydomains; do
            MES_ES=$(grep -oE "(Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Septiembre|Octubre|Noviembre|Diciembre) 2[0-9]{3}" src/$libro/contenido/00-frontmatter.md | head -1)
            MES_EN=$(grep -oE "(January|February|March|April|May|June|July|August|September|October|November|December) 2[0-9]{3}" src/$libro/contenido-en/00-frontmatter.md | head -1)
            if [ -n "$MES_ES" ] && ! grep -q "$MES_ES" src/$libro/_build/build-pdf.sh; then
              echo "::error::build-pdf.sh de $libro no dice «$MES_ES» (frontmatter ES)."; FAIL=1
            fi
            if [ -n "$MES_EN" ] && ! grep -q "$MES_EN" src/$libro/_build/build-en.sh; then
              echo "::error::build-en.sh de $libro no dice «$MES_EN» (frontmatter EN)."; FAIL=1
            fi
          done
          # 3) ningún manifiesto declara que su libro no está publicado
          if grep -rn "sin publicación pública\|not yet publicly published" src/*/para-agent*.md; then
            echo "::error::Un manifiesto declara «sin publicación pública» — los tres libros están publicados."; FAIL=1
          fi
          # 4) el shell cuenta las cinco specs de AURA
          grep -q "five specs" site/llms.txt   || { echo "::error::site/llms.txt no dice «five specs»."; FAIL=1; }
          grep -q "cinco specs" site/es/llms.txt || { echo "::error::site/es/llms.txt no dice «cinco specs»."; FAIL=1; }
          # 5) Wingmap no invierte el vocabulario (agéntico ≠ la topología agentiva)
          if grep -qE '\*\*Agéntico\*\* designa|\*\*Agentic\*\* designates' src/aura/specs/4-wingmap.md src/aura/specs-en/4-wingmap.md; then
            echo "::error::Wingmap define «Agéntico/Agentic» con la topología del mundo agentivo — residuo de renombre."; FAIL=1
          fi
          exit $FAIL

      - name: Toolchain (pandoc + XeLaTeX)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc texlive-xetex texlive-latex-extra fontconfig

      - name: Fuentes vendorizadas (src/_fonts)
        run: |
          mkdir -p ~/.local/share/fonts
          cp src/_fonts/*/*.otf ~/.local/share/fonts/
          fc-cache -f
          fc-list | grep -E "STIX Two|Source Code Pro" || (echo "::error::fuentes no registradas" && exit 1)

      - name: Construir AgencyDomains — ES (PDF + manifiesto) · EN (PDF + web) · ES web
        run: |
          bash src/agencydomains/_build/build-pdf.sh
          bash src/agencydomains/_build/build-en.sh
          bash src/agencydomains/_build/build-web.sh

      - name: Construir AURA — ES (PDF) · EN (PDF + web) · ES web
        run: |
          bash src/aura/_build/build-pdf.sh
          bash src/aura/_build/build-en.sh
          bash src/aura/_build/build-web.sh

      - name: Construir La Empresa en Tiempo Real — ES (PDF) · EN (PDF + web) · ES web
        run: |
          bash src/rte/_build/build-pdf.sh
          bash src/rte/_build/build-en.sh
          bash src/rte/_build/build-web.sh

      - name: Manifiesto unificado de la trilogía (agentes, ES+EN)
        run: bash src/trilogia/build-agentes.sh

      - name: Ensamblar sitio (shell + builds en sus rutas URL)
        run: |
          DIST=src/agencydomains/_dist
          ADIST=src/aura/_dist
          RDIST=src/rte/_dist
          mkdir -p _site
          cp -R site/. _site/
          touch _site/.nojekyll
          # los libros reemplazan cualquier placeholder del shell en su ruta
          rm -rf _site/agencydomains _site/es/agencydomains _site/aura _site/es/aura _site/real-time-enterprise _site/es/empresa-tiempo-real
          # AgencyDomains: EN → /agencydomains/ · ES → /es/agencydomains/
          cp -R "$DIST/web-en" _site/agencydomains
          cp -R "$DIST/web-es" _site/es/agencydomains
          # AURA: EN → /aura/ · ES → /es/aura/
          cp -R "$ADIST/web-en" _site/aura
          cp -R "$ADIST/web-es" _site/es/aura
          # La Empresa en Tiempo Real: EN → /real-time-enterprise/ · ES → /es/empresa-tiempo-real/
          cp -R "$RDIST/web-en" _site/real-time-enterprise
          cp -R "$RDIST/web-es" _site/es/empresa-tiempo-real
          # manifiestos para agentes → raíz de cada idioma
          mv _site/agencydomains/AgencyDomains-${AGD_VERSION}-agents-en.md  _site/
          mv _site/agencydomains/AgencyDomains-${AGD_VERSION}-agents-en.txt _site/
          mv _site/es/agencydomains/AgencyDomains-${AGD_VERSION}-agents-es.md  _site/es/
          mv _site/es/agencydomains/AgencyDomains-${AGD_VERSION}-agents-es.txt _site/es/
          mv _site/aura/AURA-${AURA_VERSION}-agents-en.md  _site/
          mv _site/aura/AURA-${AURA_VERSION}-agents-en.txt _site/
          mv _site/es/aura/AURA-${AURA_VERSION}-agents-es.md  _site/es/
          mv _site/es/aura/AURA-${AURA_VERSION}-agents-es.txt _site/es/
          mv _site/real-time-enterprise/RealTimeEnterprise-${RTE_VERSION}-agents-en.md  _site/
          mv _site/real-time-enterprise/RealTimeEnterprise-${RTE_VERSION}-agents-en.txt _site/
          mv _site/es/empresa-tiempo-real/EmpresaTiempoReal-${RTE_VERSION}-agents-es.md  _site/es/
          mv _site/es/empresa-tiempo-real/EmpresaTiempoReal-${RTE_VERSION}-agents-es.txt _site/es/
          # alias estables sin versión — siempre la edición vigente (los versionados quedan para cita exacta)
          for ext in md txt; do
            cp _site/AgencyDomains-${AGD_VERSION}-agents-en.$ext      _site/AgencyDomains-agents-en.$ext
            cp _site/AURA-${AURA_VERSION}-agents-en.$ext              _site/AURA-agents-en.$ext
            cp _site/RealTimeEnterprise-${RTE_VERSION}-agents-en.$ext _site/RealTimeEnterprise-agents-en.$ext
            cp _site/es/AgencyDomains-${AGD_VERSION}-agents-es.$ext   _site/es/AgencyDomains-agents-es.$ext
            cp _site/es/AURA-${AURA_VERSION}-agents-es.$ext           _site/es/AURA-agents-es.$ext
            cp _site/es/EmpresaTiempoReal-${RTE_VERSION}-agents-es.$ext _site/es/EmpresaTiempoReal-agents-es.$ext
          done
          # manifiesto unificado de la trilogía (URL estable, sin versión en el nombre)
          cp src/trilogia/_dist/AgentiveWorld-Trilogy-agents-en.md  _site/
          cp src/trilogia/_dist/AgentiveWorld-Trilogy-agents-en.md  _site/AgentiveWorld-Trilogy-agents-en.txt
          cp src/trilogia/_dist/Trilogia-MundoAgentivo-agentes-es.md _site/es/
          cp src/trilogia/_dist/Trilogia-MundoAgentivo-agentes-es.md _site/es/Trilogia-MundoAgentivo-agentes-es.txt
          echo "=== contenido del artefacto ===" && find _site -maxdepth 2 | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
