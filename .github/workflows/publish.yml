# Publicador por tag — construye los libros y despliega el sitio a GitHub Pages.
#
#   git tag agencydomains-v0.5 && git push --tags   → publica TODO automáticamente
#   git tag aura-v0.3 && git push --tags            → ídem (el sitio es un solo artefacto)
#
# También se puede disparar a mano (workflow_dispatch) para republicar el estado
# actual de main sin crear tag (p. ej. tras editar el shell en site/).
#
# El deploy es por artefacto (Pages en modo "GitHub Actions"): lo publicado nunca
# se committea — el repo contiene solo fuente (src/) y shell estático (site/).
name: publish

on:
  push:
    tags: ['agencydomains-v*', 'aura-v*', 'rte-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC hacia AWS; el sitio se publica en S3, no en Pages

# Las actions van ancladas por SHA, no por tag: un tag es mutable y este workflow
# obtiene credenciales que pueden reescribir el sitio publicado. El comentario
# al lado dice qué versión es ese SHA; para subir de versión, releer el SHA nuevo
# con `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Detectar versiones (CHANGELOG de cada libro) y validar tag
        run: |
          AGD_VERSION=$(grep -m1 -oE "^## v[0-9]+\.[0-9]+(\.[0-9]+)?" src/agencydomains/CHANGELOG.md | cut -d" " -f2)
          AURA_VERSION=$(grep -m1 -oE "^## v[0-9]+\.[0-9]+(\.[0-9]+)?" src/aura/CHANGELOG.md | cut -d" " -f2)
          RTE_VERSION=$(grep -m1 -oE "^## v[0-9]+\.[0-9]+(\.[0-9]+)?" src/rte/CHANGELOG.md | cut -d" " -f2)
          echo "AGD_VERSION=$AGD_VERSION" >> "$GITHUB_ENV"
          echo "AURA_VERSION=$AURA_VERSION" >> "$GITHUB_ENV"
          echo "RTE_VERSION=$RTE_VERSION" >> "$GITHUB_ENV"
          # La casa (casa.json): dónde se sirve y a dónde se publica. Ningún paso
          # cablea dominio, bucket, distribución, router ni rol.
          python3 .github/scripts/casa.py env >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              agencydomains-*) TAG_V="${GITHUB_REF_NAME#agencydomains-}"; BOOK_V="$AGD_VERSION";;
              aura-*)          TAG_V="${GITHUB_REF_NAME#aura-}";          BOOK_V="$AURA_VERSION";;
              rte-*)           TAG_V="${GITHUB_REF_NAME#rte-}";           BOOK_V="$RTE_VERSION";;
              *) echo "::error::Tag desconocido: $GITHUB_REF_NAME"; exit 1;;
            esac
            if [ "$TAG_V" != "$BOOK_V" ]; then
              echo "::error::El tag dice $TAG_V pero el CHANGELOG del libro dice $BOOK_V. Actualiza el CHANGELOG (## $TAG_V) o corrige el tag."
              exit 1
            fi
          fi

      - name: Guardia — el shell enlaza las versiones que se publican
        run: |
          # El Libro I nombra sus distribuibles por idioma (RealTimeEnterprise / EmpresaTiempoReal)
          for f in site/index.html.in; do   # llms.txt se deriva de plantilla: no puede desalinearse
            for pref in "AgencyDomains-${AGD_VERSION}-" "AURA-${AURA_VERSION}-" "RealTimeEnterprise-${RTE_VERSION}-"; do
              if ! grep -q "$pref" "$f"; then
                echo "::error::$f no enlaza ningún archivo ${pref}*. Actualiza los links del shell a la versión nueva."
                exit 1
              fi
            done
          done
          for f in site/es/index.html.in; do   # ídem
            for pref in "AgencyDomains-${AGD_VERSION}-" "AURA-${AURA_VERSION}-" "EmpresaTiempoReal-${RTE_VERSION}-"; do
              if ! grep -q "$pref" "$f"; then
                echo "::error::$f no enlaza ningún archivo ${pref}*. Actualiza los links del shell a la versión nueva."
                exit 1
              fi
            done
          done

      - name: Guardia — los derivados no derivan (builds, manifiestos, shell)
        run: |
          FAIL=0
          # 1) frontmatter.tex de AGD lleva la versión vigente (entra al PDF ES publicado)
          if ! grep -q "${AGD_VERSION}" src/agencydomains/_build/frontmatter.tex; then
            echo "::error::frontmatter.tex de AGD no menciona v${AGD_VERSION} — el PDF llevaría impresa otra versión."; FAIL=1
          fi
          # 2) el mes/año de las portadas de build coincide con el frontmatter de cada libro
          for libro in rte aura agencydomains; do
            MES_ES=$(grep -oE "(Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Septiembre|Octubre|Noviembre|Diciembre) 2[0-9]{3}" src/$libro/contenido/00-frontmatter.md | head -1)
            MES_EN=$(grep -oE "(January|February|March|April|May|June|July|August|September|October|November|December) 2[0-9]{3}" src/$libro/contenido-en/00-frontmatter.md | head -1)
            if [ -n "$MES_ES" ] && ! grep -q "$MES_ES" src/$libro/_build/build-pdf.sh; then
              echo "::error::build-pdf.sh de $libro no dice «$MES_ES» (frontmatter ES)."; FAIL=1
            fi
            if [ -n "$MES_EN" ] && ! grep -q "$MES_EN" src/$libro/_build/build-en.sh; then
              echo "::error::build-en.sh de $libro no dice «$MES_EN» (frontmatter EN)."; FAIL=1
            fi
          done
          # 3) ningún manifiesto declara que su libro no está publicado
          if grep -rn "sin publicación pública\|not yet publicly published" src/*/para-agent*.md; then
            echo "::error::Un manifiesto declara «sin publicación pública» — los tres libros están publicados."; FAIL=1
          fi
          # 4) el shell cuenta las cinco specs de AURA
          # 4b) la plantilla de llms.txt no lleva versiones escritas a mano.
          #     Sustituye a la guardia que comparaba texto contra enlace: con la
          #     plantilla el desajuste es imposible, y lo que hay que impedir es que
          #     alguien vuelva a cablear un número.
          if grep -nE 'v[0-9]+\.[0-9]+' site/llms.txt.in site/es/llms.txt.in; then
            echo "::error::llms.txt.in tiene una versión escrita a mano; usa @AGD_VERSION@ · @AURA_VERSION@ · @RTE_VERSION@."
            FAIL=1
          fi
          # 4c) las cinco specs de AURA se cuentan en la plantilla
          grep -q "five specs" site/llms.txt.in   || { echo "::error::site/llms.txt.in no dice «five specs»."; FAIL=1; }
          grep -q "cinco specs" site/es/llms.txt.in || { echo "::error::site/es/llms.txt.in no dice «cinco specs»."; FAIL=1; }
          # 5) Wingmap no invierte el vocabulario (agéntico ≠ la topología agentiva)
          if grep -qE '\*\*Agéntico\*\* designa|\*\*Agentic\*\* designates' src/aura/specs/4-wingmap.md src/aura/specs-en/4-wingmap.md; then
            echo "::error::Wingmap define «Agéntico/Agentic» con la topología del mundo agentivo — residuo de renombre."; FAIL=1
          fi
          exit $FAIL

      - name: Toolchain (pandoc + XeLaTeX)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc texlive-xetex texlive-latex-extra fontconfig

      - name: Fuentes vendorizadas (src/_fonts)
        run: |
          mkdir -p ~/.local/share/fonts
          cp src/_fonts/*/*.otf ~/.local/share/fonts/
          fc-cache -f
          fc-list | grep -E "STIX Two|Source Code Pro" || (echo "::error::fuentes no registradas" && exit 1)

      - name: Construir AgencyDomains — ES (PDF + manifiesto) · EN (PDF + web) · ES web
        run: |
          bash src/agencydomains/_build/build-pdf.sh
          bash src/agencydomains/_build/build-en.sh
          bash src/agencydomains/_build/build-web.sh

      - name: Construir AURA — ES (PDF) · EN (PDF + web) · ES web
        run: |
          bash src/aura/_build/build-pdf.sh
          bash src/aura/_build/build-en.sh
          bash src/aura/_build/build-web.sh

      - name: Construir La Empresa en Tiempo Real — ES (PDF) · EN (PDF + web) · ES web
        run: |
          bash src/rte/_build/build-pdf.sh
          bash src/rte/_build/build-en.sh
          bash src/rte/_build/build-web.sh

      - name: Manifiesto unificado de la trilogía (agentes, ES+EN)
        run: bash src/trilogia/build-agentes.sh

      - name: Ensamblar sitio (shell + builds en sus rutas URL)
        run: bash .github/scripts/ensamblar.sh

      # La página de vocabulario se DERIVA de los glosarios de los tres libros: no
      # define nada, enlaza cada término a su entrada de origen. Va antes del
      # sitemap para que éste la liste. Falla si ES y EN no son espejo.
      - name: Vocabulario canónico (derivado de los glosarios, ES + EN)
        run: python3 .github/scripts/gen-vocabulario.py _site

      # Los pares en · es de cada página de libro; las ediciones se construyen por
      # separado y solo aquí están las dos.
      - name: hreflang de los libros (pares por posición en el índice)
        run: python3 .github/scripts/gen-hreflang.py _site

      - name: Sitemap (derivado del sitio ya ensamblado)
        run: python3 .github/scripts/gen-sitemap.py _site

      # Antes de cualquier credencial: un sitio que no calza con su casa no se publica.
      - name: Guardia — la casa (enlaces bajo la base, sin dominio de la puerta, hreflang)
        run: python3 .github/scripts/guardias-casa.py _site

      # El sitio se publica en un bucket S3 PRIVADO que CloudFront lee por OAC.
      # GitHub Pages ya no participa: su URL pública duplicaba el sitio y sus
      # políticas gobernaban un origen que no controlábamos.
      # Ver work/cloudfront-analytics/RUNBOOK.md §10 (repo agencydomains-org).
      - name: Credenciales AWS (OIDC, sin secretos de larga vida)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ env.CASA_ROL }}
          aws-region: us-east-1

      - name: Publicar en S3
        run: |
          set -euo pipefail
          # Dos pasadas, y el motivo es editorial: una edición publicada NO se retira.
          # Con una sola pasada, `--delete` borraba del sitio los distribuibles de la
          # versión anterior en cuanto salía una nueva, y cada enlace compartido a un
          # PDF moría en la siguiente publicación (1.351 peticiones 404 medidas el
          # 2026-09-08). Ver DECISIONS D-24.
          #
          # 1 · todo salvo los distribuibles versionados, con --delete: limpia lo obsoleto
          aws s3 sync _site/ s3://${CASA_BUCKET}${CASA_BASE}/ \
            --delete --cache-control 'public, max-age=600' \
            --exclude '.nojekyll' \
            --exclude '*-v*.pdf' --exclude '*-v*-agents-*' --exclude '*-v*-agentes-*'
          # 2 · los distribuibles versionados, SIN --delete: se suman, no reemplazan
          aws s3 sync _site/ s3://${CASA_BUCKET}${CASA_BASE}/ \
            --cache-control 'public, max-age=600' \
            --exclude '*' \
            --include '*-v*.pdf' --include '*-v*-agents-*' --include '*-v*-agentes-*'
          # 3 · charset explícito en los textos planos. S3 los tipa `text/markdown` y
          #     `text/plain` SIN charset, y el navegador los decodifica como Latin-1:
          #     cada «—», «·», «→» y cada caja de los diagramas salía como basura.
          #     Copia en sitio sobre TODO el bucket (no solo _site/) para que también
          #     las ediciones retenidas por la pasada 2 queden corregidas.
          for pair in 'md:text/markdown' 'txt:text/plain'; do
            aws s3 cp s3://${CASA_BUCKET}${CASA_BASE}/ s3://${CASA_BUCKET}${CASA_BASE}/ \
              --recursive --exclude '*' --include "*.${pair%%:*}" \
              --content-type "${pair#*:}; charset=utf-8" \
              --cache-control 'public, max-age=600' --metadata-directive REPLACE --only-show-errors
          done
          echo "=== objetos en el bucket ==="
          aws s3 ls s3://${CASA_BUCKET}${CASA_BASE}/ --recursive --summarize | tail -3

      - name: Publicar el router del borde (lleva las versiones vigentes)
        run: |
          set -euo pipefail
          # El router redirige un distribuible de edición anterior al alias de la
          # vigente, así que necesita saber cuál es la vigente. Se la pone el build,
          # no una mano: un número cableado ahí volvería a divergir del sitio.
          sed -e "s/@AGD_VERSION@/${AGD_VERSION}/g" \
              -e "s/@AURA_VERSION@/${AURA_VERSION}/g" \
              -e "s/@RTE_VERSION@/${RTE_VERSION}/g" \
              .github/functions/router.js.in > /tmp/router.js
          if grep -n '@[A-Z_]*VERSION@' /tmp/router.js; then
            echo "::error::quedaron marcadores sin sustituir en el router."; exit 1
          fi
          ET=$(aws cloudfront describe-function --name "$CASA_ROUTER" --query ETag --output text)
          aws cloudfront update-function --name "$CASA_ROUTER" \
            --function-config '{"Comment":"www->apex, ediciones retiradas, barra final e index.html","Runtime":"cloudfront-js-2.0"}' \
            --function-code fileb:///tmp/router.js --if-match "$ET" >/dev/null
          ET=$(aws cloudfront describe-function --name "$CASA_ROUTER" --query ETag --output text)
          aws cloudfront publish-function --name "$CASA_ROUTER" --if-match "$ET" \
            --query 'FunctionSummary.Status' --output text

      - name: Invalidar CloudFront
        run: |
          set -euo pipefail
          ID=$(aws cloudfront create-invalidation \
                 --distribution-id "$CASA_DISTRIBUCION" --paths "${CASA_BASE}/*" \
                 --query 'Invalidation.Id' --output text)
          echo "invalidacion $ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CASA_DISTRIBUCION" --id "$ID"
          echo "sitio publicado en ${CASA_SITIO}${CASA_BASE}/"
